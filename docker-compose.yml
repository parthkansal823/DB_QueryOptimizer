services:
  postgres:
    build: ./postgres
    # pg_hint_plan installs planner hooks at library-load time, so it must be
    # preloaded at server start. `CREATE EXTENSION` alone (postgres/init/
    # 01_extensions.sql) registers the SQL objects but leaves hints silently
    # IGNORED -- every Leading() hint returns the planner's default plan and
    # the whole candidate set collapses to one plan. Silent because a hint
    # that can't be applied is a comment, and comments never error.
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_hint_plan
    environment:
      POSTGRES_DB: lqo
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d
      - ./data/schema.sql:/docker-entrypoint-initdb.d/02_schema.sql
      # Read-only: lets `data/job/load_job.sh` COPY the JOB/IMDB CSVs
      # (stretch goal) straight from the container, no `docker cp` needed.
      - ./data/job:/job_data:ro

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/lqo
      FRONTEND_ORIGIN: http://localhost:5173
    ports:
      - "8000:8000"
    depends_on:
      - postgres
    volumes:
      - ./backend:/app
      # Read-only: lets app.collect_data_job read the real JOB query files
      # (stretch goal) without duplicating them into backend/.
      - ./data/job/queries:/job_queries:ro

  frontend:
    build: ./frontend
    environment:
      VITE_API_BASE_URL: http://localhost:8000
    ports:
      - "5173:5173"
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules

volumes:
  pgdata:
  frontend_node_modules:
