services:
  postgres:
    build: ./postgres
    # pg_hint_plan installs planner hooks at library-load time, so it must be
    # preloaded at server start. `CREATE EXTENSION` alone (postgres/init/
    # 01_extensions.sql) registers the SQL objects but leaves hints silently
    # IGNORED -- every Leading() hint returns the planner's default plan and
    # the whole candidate set collapses to one plan. Silent because a hint
    # that can't be applied is a comment, and comments never error.
    # Postgres puts parallel-query tuples in shared memory, and Docker's 64MB
    # default /dev/shm is far too small for JOB-scale joins -- without this,
    # large candidate plans die with "could not resize shared memory segment",
    # which looks like a query failure but is purely a container limit.
    shm_size: 1gb
    command:
      - postgres
      - -c
      # `pg_stat_statements` also has to be preloaded -- it hooks the executor,
      # so `CREATE EXTENSION` alone gives you a view with nothing in it. It is
      # the single highest-signal thing available here: per-query planning time
      # separated from execution time (this project's whole cost is
      # `optimizer_overhead_ms`, and this measures the baseline it is added to),
      # shared block hits against reads (the cache-state bias that turned a
      # reported 80.5% improvement into a real 26.0%), temp blocks (a query
      # spilling because `work_mem` is too small, measured rather than guessed),
      # per-query JIT cost, `parallel_workers_to_launch` against
      # `parallel_workers_launched`, and `stddev_exec_time` -- variance from the
      # server, free, where `benchmark.py` re-runs queries to compute its own.
      - shared_preload_libraries=pg_hint_plan,pg_stat_statements
      - -c
      # The normalized query identity PostgreSQL computes itself, from the
      # post-parse-analysis tree rather than from the text. `app/query_template.py`
      # implements this by hand; the built-in one distinguishes queries whose
      # text matches but whose meaning differs under a different `search_path`,
      # and merges `IN (1,2,3)` with `IN (1,2,3,4)`. Worth comparing the two.
      - compute_query_id=on
      - -c
      # Required for the per-query I/O time columns. Off by default because the
      # clock reads are not free; `pg_test_timing` measures the overhead on a
      # given machine, and on Linux with a vDSO clocksource it is small.
      - track_io_timing=on
    environment:
      POSTGRES_DB: lqo
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      # The database lives in the repo directory rather than in a Docker named
      # volume, so everything this project produces is in one place you can see,
      # back up, and delete. A named volume is invisible from the filesystem and
      # survives `docker compose down -v` being forgotten; this does not.
      #
      # `data/pgdata/` is gitignored -- it is 9.5GB of database, not source.
      # PostgreSQL 18 changed the recommended mount point: a single mount at
      # /var/lib/postgresql, with the server placing its cluster in a version
      # subdirectory beneath it. Mounting .../data directly still works but puts
      # a mount-point boundary exactly where `pg_upgrade --link` needs to move
      # files, so the next major upgrade would have to copy 9 GB instead of
      # hard-linking it. The PG16 cluster this replaced is preserved at
      # data/pgdata_pg16 -- its `job` (IMDB/JOB) database is not regenerable
      # from schema.sql and can be reached by pointing a postgres:16 container
      # at that directory.
      - ./data/pgdata:/var/lib/postgresql
      - ./postgres/init:/docker-entrypoint-initdb.d
      - ./data/schema.sql:/docker-entrypoint-initdb.d/02_schema.sql
      # Read-only: lets `data/job/load_job.sh` COPY the JOB/IMDB CSVs
      # (stretch goal) straight from the container, no `docker cp` needed.
      - ./data/job:/job_data:ro

  backend:
    build: ./backend
    environment:
      # `lqo`, and the reason it is not `lqo_v2` any more is worth keeping.
      #
      # The original `lqo` was seeded before a bug in data/schema.sql was found:
      # a `CROSS JOIN LATERAL (... ORDER BY random() LIMIT 1)` that PostgreSQL is
      # free to evaluate once, so every user got the same city and every product
      # the same brand. `SELECT count(DISTINCT city)` returned 1 across 50,000
      # rows -- the correlated columns this whole project is built around had no
      # correlation, because they had no variety. `lqo_v2` was a reseed beside
      # it, so the two could be compared.
      #
      # `data/schema.sql` has been fixed since, and the PostgreSQL 18 upgrade
      # rebuilt the cluster from it: the fresh `lqo` has 11 cities, 5 countries,
      # 10 brands and 5 categories. It *is* the corrected database, so the v2
      # name now points at nothing and only survives as a trap. The PG16 cluster
      # holding the real `lqo_v2` is preserved at data/pgdata_pg16.
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/lqo
      FRONTEND_ORIGIN: http://localhost:5173
      # Measured best on this dataset: 87.8% of oracle headroom captured
      # versus 77.2% for the ensemble policies (docs/WRITEUP.md 2.1).
      # Which policy wins is dataset-dependent -- re-check with app.model_zoo
      # after onboarding a new database.
      SELECTION_POLICY: pairwise_rank
    ports:
      - "8000:8000"
    depends_on:
      - postgres
    volumes:
      - ./backend:/app
      # Read-only: lets app.collect_data_job read the real JOB query files
      # (stretch goal) without duplicating them into backend/.
      - ./data/job/queries:/job_queries:ro

  frontend:
    build: ./frontend
    environment:
      VITE_API_BASE_URL: http://localhost:8000
    ports:
      - "5173:5173"
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules

volumes:
  # `node_modules` stays a named volume on purpose, unlike the database above.
  # It is not project data -- it is a build artifact, and it has to be the
  # *Linux* build. The repo is bind-mounted into the container, so without this
  # shadowing it the container would import modules compiled for the host
  # platform, and anything with a native binding would fail at runtime.
  frontend_node_modules:
