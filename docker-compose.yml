services:
  postgres:
    build: ./postgres
    # pg_hint_plan installs planner hooks at library-load time, so it must be
    # preloaded at server start. `CREATE EXTENSION` alone (postgres/init/
    # 01_extensions.sql) registers the SQL objects but leaves hints silently
    # IGNORED -- every Leading() hint returns the planner's default plan and
    # the whole candidate set collapses to one plan. Silent because a hint
    # that can't be applied is a comment, and comments never error.
    # Postgres puts parallel-query tuples in shared memory, and Docker's 64MB
    # default /dev/shm is far too small for JOB-scale joins -- without this,
    # large candidate plans die with "could not resize shared memory segment",
    # which looks like a query failure but is purely a container limit.
    shm_size: 1gb
    command:
      - postgres
      - -c
      # `pg_stat_statements` also has to be preloaded -- it hooks the executor,
      # so `CREATE EXTENSION` alone gives you a view with nothing in it. It is
      # the single highest-signal thing available here: per-query planning time
      # separated from execution time (this project's whole cost is
      # `optimizer_overhead_ms`, and this measures the baseline it is added to),
      # shared block hits against reads (the cache-state bias that turned a
      # reported 80.5% improvement into a real 26.0%), temp blocks (a query
      # spilling because `work_mem` is too small, measured rather than guessed),
      # per-query JIT cost, `parallel_workers_to_launch` against
      # `parallel_workers_launched`, and `stddev_exec_time` -- variance from the
      # server, free, where `benchmark.py` re-runs queries to compute its own.
      - shared_preload_libraries=pg_hint_plan,pg_stat_statements
      - -c
      # The normalized query identity PostgreSQL computes itself, from the
      # post-parse-analysis tree rather than from the text. `app/query_template.py`
      # implements this by hand; the built-in one distinguishes queries whose
      # text matches but whose meaning differs under a different `search_path`,
      # and merges `IN (1,2,3)` with `IN (1,2,3,4)`. Worth comparing the two.
      - compute_query_id=on
      - -c
      # Required for the per-query I/O time columns. Off by default because the
      # clock reads are not free; `pg_test_timing` measures the overhead on a
      # given machine, and on Linux with a vDSO clocksource it is small.
      - track_io_timing=on
    environment:
      POSTGRES_DB: lqo
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      # The database lives in the repo directory rather than in a Docker named
      # volume, so everything this project produces is in one place you can see,
      # back up, and delete. A named volume is invisible from the filesystem and
      # survives `docker compose down -v` being forgotten; this does not.
      #
      # `data/pgdata/` is gitignored -- it is 9.5GB of database, not source.
      # A named volume, not a bind mount -- and the reversal is worth explaining
      # because the bind mount was a deliberate choice.
      #
      # It was chosen so "where is my data" had one answer you could see, copy
      # and delete like any other directory, rather than something invisible
      # that a stray `docker compose down -v` destroys. That reasoning still
      # holds. What it did not account for is that a PostgreSQL data directory
      # on a Windows filesystem is exposed to every other process that opens
      # files there.
      #
      # Measured, in one session: Windows Defender real-time scanning (on, with
      # no exclusion for this path) and the Search indexer took exclusive locks
      # on relation files, and PostgreSQL cannot open a file something else has
      # open. `ANALYZE` failed three times on three *different* relations, 14
      # integration tests failed, and `wsl --shutdown` cleared it only until the
      # next time. Worse, an attempt to route around a locked index with
      # `REINDEX` committed, could not unlink the old file, and left the server
      # unable to start at all -- WAL redo kept replaying a commit that
      # referenced the locked file. Nothing was lost, but a read error had been
      # turned into an unbootable database.
      #
      # A named volume lives inside the Docker VM, where no host scanner can
      # reach it, so the failure class becomes impossible rather than unlikely.
      # It is also markedly faster: bind-mounted I/O on Windows crosses a 9p/
      # virtiofs boundary on every page.
      #
      # The property that is lost -- seeing the files in Explorer -- is worth
      # less than it sounds, because what anyone actually wants from it is a
      # backup, and `pg_dump` gives a better one: portable across versions,
      # verifiable with `pg_restore --list`, and a fifteenth the size. See
      # README, "Where the data lives", for the commands.
      #
      # The PostgreSQL 16 cluster is still a bind-mounted directory at
      # data/pgdata_pg16 -- it holds the `job` (IMDB/JOB) database, which is not
      # regenerable from schema.sql -- and data/pgdata keeps the last PG18
      # cluster as a snapshot. Neither is mounted by anything now.
      - pgdata:/var/lib/postgresql
      - ./postgres/init:/docker-entrypoint-initdb.d
      - ./data/schema.sql:/docker-entrypoint-initdb.d/02_schema.sql
      # Read-only: lets `data/job/load_job.sh` COPY the JOB/IMDB CSVs
      # (stretch goal) straight from the container, no `docker cp` needed.
      - ./data/job:/job_data:ro

  backend:
    build: ./backend
    environment:
      # `lqo`, and the reason it is not `lqo_v2` any more is worth keeping.
      #
      # The original `lqo` was seeded before a bug in data/schema.sql was found:
      # a `CROSS JOIN LATERAL (... ORDER BY random() LIMIT 1)` that PostgreSQL is
      # free to evaluate once, so every user got the same city and every product
      # the same brand. `SELECT count(DISTINCT city)` returned 1 across 50,000
      # rows -- the correlated columns this whole project is built around had no
      # correlation, because they had no variety. `lqo_v2` was a reseed beside
      # it, so the two could be compared.
      #
      # `data/schema.sql` has been fixed since, and the PostgreSQL 18 upgrade
      # rebuilt the cluster from it: the fresh `lqo` has 11 cities, 5 countries,
      # 10 brands and 5 categories. It *is* the corrected database, so the v2
      # name now points at nothing and only survives as a trap. The PG16 cluster
      # holding the real `lqo_v2` is preserved at data/pgdata_pg16.
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/lqo
      FRONTEND_ORIGIN: http://localhost:5173
      # SELECTION_POLICY is deliberately NOT set here.
      #
      # It used to be, as `pairwise_rank` -- measured best on this dataset,
      # 87.8% of oracle headroom against 77.2% for the ensemble policies
      # (docs/WRITEUP.md 2.1). Correct value, wrong place. Setting it on this
      # service put it inside this container only, and `app.calibrate`,
      # `app.retrain` and `app.benchmark` are run from the host, where it was
      # unset and the code default `greedy` applied. So the gate in
      # models/gate.json was swept under a policy the server does not use, and
      # promotion scored one too.
      #
      # Measured on 15 held-out queries (2.43), that gap is the whole result:
      # `greedy` lands at 104.1% of native and `pairwise_rank` at 95.1%,
      # against an oracle of 83.6%. The only policy that beats PostgreSQL was
      # the only one never calibrated.
      #
      # The default now lives once, in `learned.DEFAULT_SELECTION_POLICY`, so
      # host and container agree without anything having to be kept in sync.
      # Export SELECTION_POLICY to override it in both places at once.
    ports:
      - "8000:8000"
    depends_on:
      - postgres
    volumes:
      - ./backend:/app
      # Read-only: lets app.collect_data_job read the real JOB query files
      # (stretch goal) without duplicating them into backend/.
      - ./data/job/queries:/job_queries:ro

  frontend:
    build: ./frontend
    environment:
      VITE_API_BASE_URL: http://localhost:8000
    ports:
      - "5173:5173"
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules

volumes:
  pgdata:
  # `node_modules` is a named volume for a different reason than the database
  # above, and the distinction is worth keeping: the database moved to one to
  # escape host file locks, while this one was never a candidate for a bind
  # mount at all. It is not project data -- it is a build artifact, and it has
  # to be the *Linux* build. The repo is bind-mounted into the container, so without this
  # shadowing it the container would import modules compiled for the host
  # platform, and anything with a native binding would fail at runtime.
  frontend_node_modules:
